services:
  - type: web
    name: benchmarking-arabic-llms
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
    buildCommand: |
      pip install --upgrade pip
      pip install poetry==1.8.3
      poetry config virtualenvs.create false
      poetry install --no-interaction --no-ansi --no-root
    startCommand: PYTHONPATH=src streamlit run src/benchmark_arabic_llms/main.py --server.address 0.0.0.0 --server.port $PORT
