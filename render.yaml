services:
  - type: web
    name: benchmarking-arabic-llms
    env: python
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
    buildCommand: |
      pip install --upgrade pip uv
      uv pip install --system -e .
    startCommand: PYTHONPATH=src streamlit run src/benchmark_arabic_llms/main.py --server.address 0.0.0.0 --server.port $PORT
