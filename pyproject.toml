[project]
name = "benchmark-arabic-llms"
version = "0.1.0"
description = "Benchmark Arabic LLMs"
readme = "README.md"
requires-python = ">=3.11,!=3.14.1,<3.15"
authors = [
    { name = "username", email = "user.name@gmail.com" }
]
dependencies = [
    "requests>=2.32.3",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.6.0",
    "tqdm>=4.67.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.2",
    "streamlit>=1.52.0",
    "google-genai>=1.2.0",
    "sacrebleu>=2.5.0",
    "bert-score>=0.3.13",
    "torch>=2.2.0",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "python-multipart>=0.0.27",
    "sse-starlette>=3.4.2",
    "nltk>=3.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
benchmark-arabic-llms = "benchmark_arabic_llms.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_arabic_llms"]
