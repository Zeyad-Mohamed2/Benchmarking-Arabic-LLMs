[tool.poetry]
name = "benchmark-arabic-llms"
version = "0.1.0"
description = "Benchmark Arabic LLMs"
authors = ["username <user.name@gmail.com>"]
readme = "README.md"
packages = [{ include = "benchmark_arabic_llms", from = "src" }]

[tool.poetry.dependencies]
# Allow Render default 3.13 and local 3.14.x while skipping known-bad 3.14.1.
python = ">=3.11,!=3.14.1,<3.15"
requests = "^2.32.3"
rouge-score = "^0.1.2"
scikit-learn = "^1.6.0"
tqdm = "^4.67.0"
pandas = "^2.3.0"
openpyxl = "^3.1.5"
python-dotenv = "^1.2.2"
streamlit = "^1.52.0"
google-genai = "^1.2.0"
sacrebleu = "^2.5.0"
bert-score = "^0.3.13"
torch = "^2.11.0"
fastapi = "^0.136.1"
uvicorn = "^0.46.0"
python-multipart = "^0.0.27"
sse-starlette = "^3.4.2"
nltk = "^3.9.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

